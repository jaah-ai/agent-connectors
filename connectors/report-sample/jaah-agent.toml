# Manifest 2: the node runs `command` from this folder as the engine of its ACP host. This folder carries
# `jaah_agent` and `requirements.txt` beside agent.py — generated by the Agent SDK's examples/vendor.py into the
# published tree, never committed in the source; the node installs the dependencies it lists before `command` starts.
[agent]
manifest = 2
name         = "report-sample"
display_name = "Report sample"
description  = "A non-coding sample: reads the task and its input documents, writes an HTML brief, uploads it as the task's report and settles. No model, no code change."
type         = "non_coding"
language     = "python"
command      = ["python3", "agent.py"]
version      = "2.0.0"
maintainer   = "@jaah-ai"
personas     = ["researcher", "coder"]
