# Manifest 2: the node runs `command` from this folder as the engine of its ACP host. Its agent/ carries
# `jaah_agent` and `requirements.txt` beside main.py — generated by the Agent SDK's examples/vendor.py into the
# published tree, never committed in the source; the node installs the dependencies it lists before `command` starts.
[agent]
manifest = 2
name         = "codex-reference"
display_name = "Codex (reference)"
description  = "Drives the OpenAI Codex CLI headlessly as a coding agent: works the task in its worktree, asks when blocked, reports usage, and delivers a merged PR."
type         = "coding"
language     = "python"
command      = ["python3", "agent/main.py"]
version      = "2.0.0"
maintainer   = "@jaah-ai"
personas     = ["coder"]
